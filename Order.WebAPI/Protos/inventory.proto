syntax = "proto3";

option csharp_namespace = "Order.WebAPI.Protos";

service InventoryService {
  rpc GetProduct (GetProductRequest) returns (ProductResponse);
  rpc GetProducts (GetProductsRequest) returns (ProductsResponse);
  rpc GetCategory (GetCategoryRequest) returns (CategoryResponse);
  rpc GetCategories (GetCategoriesRequest) returns (CategoriesResponse);
  rpc GetProductsByCategory (GetProductsByCategoryRequest) returns (ProductsResponse);
}

message GetProductRequest {
  int32 id = 1;
  string sku = 2;
}

message GetProductsRequest {
  int32 page = 1;
  int32 page_size = 2;
}

message GetCategoryRequest {
  int32 id = 1;
}

message GetCategoriesRequest {
}

message GetProductsByCategoryRequest {
  int32 category_id = 1;
}

message ProductResponse {
  int32 id = 1;
  string name = 2;
  string description = 3;
  string sku = 4;
  double price = 5;
  int32 category_id = 6;
  string category_name = 7;
}

message ProductsResponse {
  repeated ProductResponse products = 1;
  int32 total_count = 2;
}

message CategoryResponse {
  int32 id = 1;
  string name = 2;
  string description = 3;
}

message CategoriesResponse {
  repeated CategoryResponse categories = 1;
  int32 total_count = 2;
}